# Basic
CONFIG_ARM_MPU=y
CONFIG_FPU=y
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_DMA=y
CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_CRC=y
# MIPI DBI
CONFIG_MIPI_DBI=y
CONFIG_INPUT=y

CONFIG_INPUT_FT5336_INTERRUPT=y

CONFIG_SOC_FLASH_STM32=y
CONFIG_FLASH_EX_OP_ENABLED=y
CONFIG_FLASH_STM32_READOUT_PROTECTION=y

# External SPI NOR Flash (W25Q64F)
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# File System
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# gzm fs_mgr
CONFIG_GZM_FS_MGR=y

# State Machine Framework
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_SMF_INITIAL_TRANSITION=y

# Heap
CONFIG_HEAP_MEM_POOL_SIZE=2048

# LVGL Settings
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_FLUSH_THREAD=y

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y

CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y

CONFIG_LV_USE_LOG=n
CONFIG_LV_USE_OBSERVER=y

# XBEE
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_LINE_CTRL=y

# PWM
CONFIG_PWM=y

# USB CDC ACM NEXT
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_MANUFACTURER="HFN"
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="USBD CDC ACM sample"

# Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_BOOT_BANNER=n

# Binary descriptors
CONFIG_BINDESC=y
CONFIG_BINDESC_DEFINE=y
CONFIG_BINDESC_DEFINE_BUILD_TIME=y
CONFIG_BINDESC_BUILD_DATE_TIME_STRING=y
CONFIG_BINDESC_DEFINE_VERSION=y
CONFIG_BINDESC_KERNEL_VERSION_STRING=y
CONFIG_BINDESC_KERNEL_VERSION_MAJOR=y
CONFIG_BINDESC_APP_VERSION_STRING=y

CONFIG_SHELL=y
CONFIG_I2C_SHELL=y

CONFIG_DEBUG=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1
